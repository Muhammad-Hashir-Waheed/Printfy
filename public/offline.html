<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D42F25">
<title>You're offline · Joji Arts</title>
<style>
  :root { --red: #D42F25; --ink: #1a1512; --paper: #FAF7F2; --muted: #6f655b }
  @media (prefers-color-scheme: dark) { :root { --ink: #f4eee7; --paper: #15110f; --muted: #a99c90 } }
  * { box-sizing: border-box }
  html, body { height: 100% }
  body { margin: 0; display: grid; place-items: center; background: var(--paper); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)) }
  main { max-width: 26rem; text-align: center; display: grid; gap: 14px; justify-items: center }
  svg { width: 84px; height: 84px }
  h1 { margin: 6px 0 0; font-size: 1.7rem; letter-spacing: -.02em; line-height: 1.15 }
  p { margin: 0; color: var(--muted) }
  a, button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px;
    font: 600 15px system-ui, sans-serif; text-decoration: none; cursor: pointer }
  button { background: var(--red); color: #fff; border: 0 }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px }
  .ghost { border: 1px solid currentColor; color: var(--ink) }
</style>
</head>
<body>
<main>
  <svg viewBox="-14 -12 128 128" aria-hidden="true">
    <rect x="-14" y="-12" width="128" height="128" rx="28" fill="#D42F25"/>
    <path d="M10 18H62M62 18L88 84M62 18L41 84M50.5 58H76.5M30 18V60C30 75 21 82 10.5 77.5" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>You're offline</h1>
  <p>Joji Arts needs an internet connection to show products and send quote requests. Check your connection and try again.</p>
  <div class="row">
    <button type="button" onclick="location.reload()">Try again</button>
    <a class="ghost" href="tel:+923156111181">Call 0315-61-111-81</a>
  </div>
</main>
<script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
