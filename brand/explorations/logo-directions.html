<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>
  :root { --red:#D42F25; --ink:#1a1512; --paper:#FAF7F2; --gold:#D9AE4F; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Bricolage Grotesque',sans-serif; background:#ece6dc; padding:40px; width:1600px; }
  h1 { font-size:22px; letter-spacing:.2em; text-transform:uppercase; color:#8a7f72; margin-bottom:28px; font-weight:500 }
  .row { display:grid; grid-template-columns: 300px 1fr 1fr 1fr; gap:20px; margin-bottom:22px; align-items:stretch }
  .card { background:var(--paper); border-radius:22px; padding:28px; display:flex; align-items:center; justify-content:center; gap:22px; min-height:230px }
  .dark { background:var(--ink) }
  .red { background:var(--red) }
  .meta { background:transparent; flex-direction:column; align-items:flex-start; justify-content:center; padding:8px 4px }
  .meta b { font-size:30px; color:var(--ink); letter-spacing:-.02em }
  .meta span { font-size:15px; color:#6b6157; line-height:1.45; margin-top:8px; font-family:system-ui }
  .word { font-size:40px; letter-spacing:-.035em; line-height:1; white-space:nowrap }
  .word .j { font-weight:800 } .word .a { font-weight:500; opacity:.55 }
  .lock { display:flex; align-items:center; gap:14px }
  .sizes { display:flex; align-items:flex-end; gap:18px }
</style>
</head>
<body>
<h1>Joji Arts · logo directions</h1>
<div id="rows"></div>
<script>
/* ---------- Marks, all on a 64×64 grid ---------- */

// 1 · THE FOLD — a J cut from a sheet whose corner folds over, like a box flap / paper proof
function fold(fg='#fff', bg='var(--red)', flap='#F3B4A9') {
  return `<svg viewBox="0 0 64 64" width="SIZE" height="SIZE">
    <path d="M14 0H44L64 20V50A14 14 0 0 1 50 64H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0Z" fill="${bg}"/>
    <path d="M44 0V12A8 8 0 0 0 52 20H64Z" fill="${flap}"/>
    <path d="M17 19H37M33 19V39.5C33 46.5 28.5 50 22.5 50C19.6 50 17.4 49.1 15.8 47.6" fill="none" stroke="${fg}" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46.5" cy="45.5" r="4.2" fill="${fg}"/>
  </svg>`
}

// 2 · REGISTRATION — the printer's registration mark, its vertical line becomes the J
function reg(fg='var(--ink)', accent='var(--red)') {
  return `<svg viewBox="0 0 64 64" width="SIZE" height="SIZE">
    <circle cx="34" cy="28" r="16" fill="none" stroke="${accent}" stroke-width="5.2"/>
    <path d="M10 28H58" stroke="${fg}" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M34 5V41.5C34 49.5 29 55 21.5 55C17.6 55 14.6 53.6 12.6 51.2" fill="none" stroke="${fg}" stroke-width="6.4" stroke-linecap="round"/>
  </svg>`
}

// 3 · THE SEAL — the current hand-lettered JA, refined and set on a perforated postage-stamp edge
function seal(fg='#fff', bg='var(--red)') {
  // perforated edge: a rounded square with semicircle bites along each side
  const bites = []; const n = 5, s = 64, r = 3.4
  for (let i = 0; i < n; i++) { const t = 10 + i * (44 / (n - 1)); bites.push([t, 0], [t, s], [0, t], [s, t]) }
  return `<svg viewBox="0 0 64 64" width="SIZE" height="SIZE">
    <defs><mask id="m${Math.random().toString(36).slice(2)}">
      <rect width="64" height="64" fill="#fff"/>${bites.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#000"/>`).join('')}
    </mask></defs>
    <g mask="url(#MASK)"><rect width="64" height="64" rx="7" fill="${bg}"/></g>
    <g fill="none" stroke="${fg}" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 18.5C20.5 17.4 29.5 17.3 38.5 17.6" stroke-width="2.8"/>
      <path d="M23.3 18.2V36.6C23.3 42.2 20.2 45.2 14.8 44.4" stroke-width="5.6"/>
      <path d="M38.5 17.6L30.4 46" stroke-width="2.9"/>
      <path d="M38.5 17.6L47.6 46" stroke-width="5.6"/>
      <path d="M31.6 36.4C36.6 35 42.6 34.2 49.6 33.5" stroke-width="2.8"/>
    </g>
  </svg>`
}

function fix(svg, size) {
  const id = (svg.match(/mask id="(m[a-z0-9]+)"/) || [])[1]
  return svg.replaceAll('SIZE', size).replace('url(#MASK)', `url(#${id})`)
}
const word = (dark) => `<span class="word" style="color:${dark ? '#fff' : 'var(--ink)'}"><span class="j">Joji</span> <span class="a">Arts</span></span>`

const concepts = [
  { name: '1 · The Fold', note: 'A J cut from a sheet whose corner folds back — a box flap, a paper proof. Packaging-first. The dot is the full stop of a finished job.', mk: fold, onDark: () => fold('#fff', 'var(--red)', '#F3B4A9'), onRed: () => fold('var(--red)', '#fff', '#f6d2cb') },
  { name: '2 · Registration', note: "The printer's registration mark — on every sheet that leaves a press. Its vertical stroke becomes the J. Speaks print & precision.", mk: reg, onDark: () => reg('#fff', 'var(--red)'), onRed: () => reg('#fff', '#fff') },
  { name: '3 · The Seal', note: 'The current hand-lettered JA, redrawn with more contrast and set on a perforated stamp edge. Keeps today’s recognition, adds craft.', mk: seal, onDark: () => seal(), onRed: () => seal('var(--red)', '#fff') },
]

document.getElementById('rows').innerHTML = concepts.map((c) => `
  <div class="row">
    <div class="card meta"><b>${c.name}</b><span>${c.note}</span></div>
    <div class="card"><div class="lock">${fix(c.mk(), 72)}${word(false)}</div></div>
    <div class="card dark"><div class="lock">${fix(c.onDark(), 72)}${word(true)}</div></div>
    <div class="card"><div class="sizes">${fix(c.mk(), 128)}${fix(c.mk(), 48)}${fix(c.mk(), 32)}${fix(c.mk(), 16)}<span style="width:6px"></span>${fix(c.onRed(), 64).replace('<svg', '<svg style="background:var(--red);border-radius:14px;padding:6px"')}</div></div>
  </div>`).join('')
</script>
</body>
</html>
