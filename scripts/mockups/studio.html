<!doctype html>
<html>
   <head>
      <meta charset="utf-8" />
      <style>
         body { margin: 0; background: #000; }
         canvas { display: none; }
      </style>
      <script type="importmap">
         {
            "imports": {
               "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/"
            }
         }
      </script>
   </head>
   <body>
      <script type="module">
         import { render } from './studio.js'
         import { RECIPES } from './recipes.js'
         import { autoRecipe } from './recipes/auto.js'

         let catalog = []
         const byKey = new Map()
         window.setCatalog = (c) => {
            catalog = c
            for (const p of c) byKey.set(p.key, p)
         }
         const sceneFor = (key) => RECIPES[key] || autoRecipe(byKey.get(key))
         window.renderableKeys = () => catalog.filter((p) => sceneFor(p.key)).map((p) => p.key)
         window.renderKey = async (key) => {
            const recipe = sceneFor(key)
            if (!recipe) throw new Error(`No scene for ${key}`)
            return render(await recipe())
         }
         window.studioReady = true
      </script>
   </body>
</html>
